    const D = {"cell":97.5,"groups":{"A":{"cells":[[0,0],[1,0],[1,1],[0,1],[0,2],[1,2],[1,3],[0,3],[0,4],[1,4],[1,5],[1,6]],"kf":[{"t0":1.05,"t1":2.35,"p0":0,"p1":10,"e":"lin"},{"t0":2.5700000000000003,"t1":2.788888888888889,"p0":10,"p1":11,"e":"lin"},{"t0":3.3388888888888895,"t1":3.8388888888888895,"p0":11,"p1":0,"e":"inout"}],"hit":2.789,"wipe":3.3388888888888895,"red":10,"wall":1,"redCell":null,"dead":false,"level":0,"on":[0.8,3.8388888888888895]},"B":{"cells":[[0,0],[1,0],[1,1],[0,1],[0,2],[1,2],[1,3],[0,3],[0,4],[1,4],[1,5],[0,5],[0,6],[0,7],[1,7],[1,6],[2,6],[2,5],[2,4],[2,3]],"kf":[{"t0":4.19888888888889,"t1":5.95888888888889,"p0":0,"p1":16,"e":"lin"},{"t0":5.95888888888889,"t1":6.422222222222222,"p0":16,"p1":19,"e":"lin"},{"t0":6.972222222222221,"t1":7.472222222222221,"p0":19,"p1":0,"e":"inout"}],"hit":6.422,"wipe":6.972222222222221,"red":18,"wall":null,"redCell":"2,3","dead":false,"level":1,"on":[3.8988888888888895,7.472222222222221]},"C":{"cells":[[0,0],[1,0],[1,1],[0,1],[0,2],[1,2],[1,3],[0,3],[0,4],[1,4],[1,5],[0,5],[0,6],[0,7],[1,7],[1,6],[2,6],[2,7],[3,7],[3,6],[3,5],[2,5],[2,4],[3,4],[3,3],[2,3],[2,2],[3,2],[3,1],[2,1],[2,0],[3,0],[4,0],[5,0],[5,1],[4,1],[4,2],[5,2],[5,3],[4,3],[4,4],[5,4],[5,5],[4,5],[4,6],[4,7],[5,7],[5,6],[6,6],[7,6],[7,7],[6,7]],"kf":[{"t0":7.8422222222222215,"t1":11.010222222222222,"p0":0,"p1":48,"e":"lin"},{"t0":11.010222222222222,"t1":11.430222222222222,"p0":48,"p1":51,"e":"lin"},{"t0":12.522222222222222,"t1":13.022222222222222,"p0":51,"p1":0,"e":"inout"}],"hit":11.822,"wipe":12.522222222222222,"search":[11.430222222222222,11.822222222222223],"red":null,"wall":null,"redCell":null,"dead":true,"level":2,"on":[7.542222222222222,13.022222222222222]},"S":{"cells":[[0,0],[1,0],[1,1],[0,1],[0,2],[1,2],[1,3],[0,3],[0,4],[1,4],[1,5],[0,5],[0,6],[0,7],[1,7],[1,6],[2,6],[2,7],[3,7],[3,6],[3,5],[2,5],[2,4],[3,4],[3,3],[2,3],[2,2],[3,2],[3,1],[2,1],[2,0],[3,0],[4,0],[5,0],[5,1],[4,1],[4,2],[5,2],[5,3],[4,3],[4,4],[5,4],[5,5],[4,5],[4,6],[4,7],[5,7],[5,6],[6,6],[6,7],[7,7],[7,6],[7,5],[6,5],[6,4],[7,4],[7,3],[6,3],[6,2],[7,2],[7,1],[7,0],[6,0],[6,1]],"kf":[{"t0":13.402222222222223,"t1":18.92222222222222,"p0":0,"p1":63,"e":"solve"}],"hit":18.922,"wipe":null,"red":null,"wall":null,"redCell":null,"dead":false,"level":3,"on":[13.102222222222222,99]}},"order":["A","B","C","S"],"switches":[3.899,7.542,13.102],"hookTap":0.5,"m0":0.03,"meter":[{"t":0.8,"v":0.125,"d":0.3,"e":"back"},{"t":2.939,"v":0.08499999999999999,"d":0.4,"e":"inout"},{"t":3.899,"v":0.375,"d":0.3,"e":"back"},{"t":6.572,"v":0.335,"d":0.4,"e":"inout"},{"t":7.542,"v":0.625,"d":0.3,"e":"back"},{"t":11.972,"v":0.585,"d":0.4,"e":"inout"},{"t":13.102,"v":0.875,"d":0.3,"e":"back"},{"t":18.922,"v":0.97,"d":0.3,"e":"back"}],"trackW":860,"hit3":18.922,"genius":19.042,"out":20.15,"tip":[26.35,10.2],"fails":[2.789,6.422,11.822],"shakes":[2.789,6.422]};
    const $ = (id) => document.getElementById("brain-" + id);
    const STOPS = [[255,107,44],[255,197,61],[255,77,109],[232,121,249]];
    const RED = "#F87171", WHITE = "#F8FAFC", NUM = "#FB7185", SOFT = "#94A3B8", TEAL = "#2DD4BF", EMBER = "#FF6B2C";
    const clamp = (v) => Math.max(0, Math.min(1, v));
    const E = {
      lin: (u) => u,
      inout: (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2),
      solve: (u) => 0.5 * u + 0.5 * u * u * (3 - 2 * u),
      back: (u) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); },
    };
    const out4 = (x) => 1 - Math.pow(1 - clamp(x), 4);
    const in3 = (x) => Math.pow(clamp(x), 3);
    const smooth = (x) => { const u = clamp(x); return u * u * (3 - 2 * u); };
    function colorAt(i) {
      if (i <= 0) i = 0;
      const w = (i / 4) % STOPS.length, k = Math.floor(w) % STOPS.length, f = w - Math.floor(w);
      const a = STOPS[k], b = STOPS[(k + 1) % STOPS.length];
      return "rgb(" + a.map((v, j) => Math.round(v + (b[j] - v) * f)).join(",") + ")";
    }
    const G = {};
    for (const name of D.order) {
      G[name] = Object.assign({}, D.groups[name], { segs: Array.from(document.querySelectorAll("#brain-rib-" + name + " [data-seg]")) });
    }
    const nums = Array.from(document.querySelectorAll("#brain-nums [data-num]"));
    const walls = Array.from(document.querySelectorAll("#brain-walls [data-wall]"));
    const deadCells = Array.from(document.querySelectorAll("#brain-dead [data-dcell]"));
    const labs = [0, 1, 2, 3].map((k) => $("lab" + k));
    const tip = $("tip"), tipGlow = $("tipglow"), tipDot = $("tipdot");
    const hand = $("hand"), stage = $("stage"), board = $("board");
    const brain = $("brain"), fill = $("fill"), smile = $("smile"), frown = $("frown");
    const hookRing = $("hookring"), redRing = $("redring"), flash = $("flash"), ring = $("ring");
    const genius = $("genius"), head = $("head"), meter = $("meter");
    const centre = (c) => [(c[1] + 0.5) * D.cell, (c[0] + 0.5) * D.cell];
    function pAt(g, t) {
      let p = g.kf[0].p0;
      for (const k of g.kf) {
        if (t < k.t0) break;
        p = k.p0 + (k.p1 - k.p0) * E[k.e](clamp((t - k.t0) / (k.t1 - k.t0)));
      }
      return p;
    }
    // 1 while the hand is down drawing, eased at both ends.
    function pressAt(t) {
      let v = 0;
      v = Math.max(v, smooth((t - (D.hookTap - 0.1)) / 0.1) * (1 - smooth((t - (D.hookTap + 0.12)) / 0.15)));
      for (const name of D.order) {
        const kf = G[name].kf;
        for (const k of kf) v = Math.max(v, smooth((t - (k.t0 - 0.12)) / 0.12) * (1 - smooth((t - k.t1 - 0.05) / 0.15)));
      }
      return v;
    }
    function meterAt(t) {
      let from = D.m0, v = D.m0;
      for (const k of D.meter) {
        if (t < k.t) break;
        v = from + (k.v - from) * E[k.e](clamp((t - k.t) / k.d));
        from = k.v;
      }
      return v;
    }
    function render(t) {
      let gi = 0;
      while (gi < D.switches.length && t >= D.switches[gi]) gi++;
      const name = D.order[gi];
      const g = G[name];
      const p = pAt(g, t);
      const hit = t >= g.hit;
      for (const other of D.order) {
        const og = G[other];
        for (let i = 0; i < og.segs.length; i++) {
          const f = other === name ? clamp(p - i) : 0;
          const s = og.segs[i];
          s.setAttribute("opacity", f > 0 ? "1" : "0");
          s.setAttribute("stroke-dashoffset", String(D.cell * (1 - f)));
          s.setAttribute("stroke", og.red === i && t >= og.hit ? RED : s.dataset.stroke);
        }
      }
      // tip
      const i = Math.min(Math.floor(p), g.cells.length - 1);
      const f = p - i;
      const a = centre(g.cells[i]), b = centre(g.cells[Math.min(i + 1, g.cells.length - 1)]);
      const x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
      const deadOn = g.dead && hit ? out4((t - g.hit) / 0.12) * (1 - smooth((t - g.wipe) / 0.2)) : 0;
      const red = (g.red !== null && hit && p > g.red) || deadOn > 0.5;
      const col = red ? RED : colorAt(p);
      for (const el of [tipGlow, tipDot]) { el.setAttribute("cx", x); el.setAttribute("cy", y); el.setAttribute("fill", col); }
      tip.setAttribute("opacity", p > 0.05 ? "1" : String(clamp(p / 0.05)));
      // numbers light up as the line passes them; the out-of-order one goes red
      const idxOf = new Map(g.cells.map((c, k) => [c[0] + "," + c[1], k]));
      for (const n of nums) {
        const k = idxOf.get(n.dataset.cell);
        const on = k !== undefined && p > 0.02 && p >= k - 0.35;
        const bad = g.redCell === n.dataset.cell && hit && on;
        n.setAttribute("fill", bad ? RED : on ? WHITE : NUM);
        n.setAttribute("stroke-width", on ? "8" : "0");
      }
      for (const w of walls) w.setAttribute("stroke", g.wall !== null && String(g.wall) === w.dataset.wall && hit && p > g.red ? RED : WHITE);
      // red ring on the offending cell, fading as the line wipes back
      if (g.red !== null && hit && p > g.red) {
        // wall fail: ring the crossed wall (mid-step); order fail: ring the number reached
        const e = centre(g.cells[g.red + 1]), s0 = centre(g.cells[g.red]);
        const c = g.wall !== null ? [(e[0] + s0[0]) / 2, (e[1] + s0[1]) / 2] : e;
        const h = t - g.hit;
        redRing.style.opacity = String(out4(h / 0.12) * clamp(p - g.red));
        redRing.style.transform = "translate(" + (c[0] - 46) + "px," + (c[1] - 46) + "px) scale(" + (1 + 0.5 * Math.exp(-10 * h)) + ")";
      } else redRing.style.opacity = "0";
      // dead end: every stranded cell pulses a red outline until the wipe
      const pulse = deadOn * (0.7 + 0.3 * Math.cos(2 * Math.PI * 2.5 * Math.max(0, t - g.hit)));
      for (const d of deadCells) d.setAttribute("opacity", String(pulse));
      // hook ring on "1" as the hand presses it
      const c1 = centre(g.cells[0]);
      const hr = t - D.hookTap;
      hookRing.style.opacity = hr >= 0 ? String(out4(hr / 0.25) * (1 - smooth((hr - 0.5) / 0.2))) : "0";
      hookRing.style.transform = "translate(" + (c1[0] - 46) + "px," + (c1[1] - 46) + "px) scale(" + (hr >= 0 ? 1 + 0.8 * Math.exp(-9 * hr) : 1.8) + ")";
      // board shake on each fail: ~8 px, damped
      let sx = 0;
      for (const fh of D.shakes) { const h = t - fh; if (h >= 0 && h < 0.8) sx += 8 * Math.exp(-6 * h) * Math.sin(2 * Math.PI * 8 * h); }
      // hand rides the tip; lifts and grows a touch when not pressing
      const lift = 1 - pressAt(t);
      const away = smooth((t - (D.hit3 + 0.2)) / 0.55);
      // on a fail the hand recoils off the bad move so the red reads, then rides the wipe back
      let rec = 0;
      if (g.wipe !== null && t >= g.hit) rec = out4((t - g.hit) / 0.18) * (1 - smooth((t - g.wipe) / 0.25));
      // at the dead end the hand hovers, looking for a way on
      let sw = 0;
      if (g.search && t >= g.search[0] && t < g.search[1] + 0.1) { const h = t - g.search[0]; sw = 14 * Math.sin(2 * Math.PI * 2.6 * h) * smooth(h / 0.08); }
      const hx = x + 10 * lift + 260 * away + 70 * rec + sw, hy = y + 16 * lift + 420 * away + 120 * rec;
      hand.style.transform = "translate(" + (hx - D.tip[0]) + "px," + (hy - D.tip[1]) + "px) scale(" + (1 + 0.07 * lift) + ")";
      hand.style.opacity = String(1 - away);
      // solve: teal flash, ring, bump; Genius pop
      const h3 = t - D.hit3;
      flash.style.opacity = h3 >= 0 ? String(0.5 * Math.pow(1 - clamp(h3 / 0.6), 2)) : "0";
      ring.style.opacity = h3 >= 0 ? String(out4(h3 / 0.3)) : "0";
      const bump = h3 >= 0 ? 1 + 0.025 * Math.exp(-6 * h3) * Math.cos(12 * h3) : 1;
      // fall away at the end of the scene
      const o = in3((t - D.out) / 0.4);
      stage.style.transform = "translate(" + sx + "px," + 220 * o + "px) scale(" + bump + ")";
      stage.style.opacity = String(1 - o);
      stage.style.filter = "blur(" + 14 * o + "px)";
      for (const el of [head, meter]) { el.style.opacity = String(1 - o); el.style.filter = "blur(" + 8 * o + "px)"; }
      if (genius) {
        const hg = t - D.genius;
        const pop = hg >= 0 ? 1 - Math.exp(-7 * hg) * Math.cos(13 * hg) : 0;
        genius.style.opacity = String((hg >= 0 ? out4(hg / 0.12) : 0) * (1 - o));
        genius.style.transform = "scale(" + Math.max(0, pop) + ")";
        genius.style.filter = "blur(" + 10 * o + "px)";
      }
      // meter
      const m = meterAt(t);
      fill.style.width = (m * D.trackW) + "px";
      let wob = 0, sad = 0;
      for (const fh of D.fails) { const h = t - fh; if (h >= 0 && h < 1.6) { wob += 10 * Math.exp(-4 * h) * Math.sin(14 * h); sad = Math.max(sad, 1 - smooth((h - 1.2) / 0.3)); } }
      const geniusBob = h3 >= 0 ? 1 + 0.18 * Math.exp(-6 * h3) * Math.cos(14 * h3) : 1;
      brain.style.transform = "translateX(" + (m * D.trackW) + "px) rotate(" + wob + "deg) scale(" + geniusBob + ")";
      smile.setAttribute("opacity", String(1 - sad));
      frown.setAttribute("opacity", String(sad));
      // the label of the level that owns the try is lit while it draws: ember, red on a fail, teal on Genius
      const act = Math.min(3, Math.floor(m * 4));
      const own = t >= g.on[0] && t < g.on[1];
      labs.forEach((l, k) => {
        const mine = own && k === g.level;
        l.style.color = mine ? (k === 3 && h3 >= 0 ? TEAL : g.wipe !== null && hit ? RED : EMBER) : k === act ? (k === 3 && h3 >= 0 ? TEAL : WHITE) : SOFT;
        const on = own && k === g.level ? smooth((t - g.on[0]) / 0.2) * (1 - smooth((t - g.on[1] + 0.2) / 0.2)) : 0;
        l.style.transform = "translateY(" + (-6 * on) + "px) scale(" + (1 + 0.12 * on) + ")";
      });
    }
    const state = { t: 0 };
    render(0);
    // One linear driver over the whole scene; render(t) is a pure function of it.
    tl.fromTo(state, { t: 0 }, { t: 20.6, duration: 20.6, ease: "none", onUpdate: () => render(state.t) }, 0);
    window.__timelines["brain"] = tl;
  </script>
