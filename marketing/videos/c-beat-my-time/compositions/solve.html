        <g><line x1="585" y1="308.1" x2="585" y2="374.4" stroke="#F8FAFC" stroke-opacity="0.88" stroke-width="13" stroke-linecap="round"/><line x1="487.5" y1="600.6" x2="487.5" y2="666.9" stroke="#F8FAFC" stroke-opacity="0.88" stroke-width="13" stroke-linecap="round"/><line x1="97.5" y1="600.6" x2="97.5" y2="666.9" stroke="#F8FAFC" stroke-opacity="0.88" stroke-width="13" stroke-linecap="round"/><line x1="292.5" y1="210.6" x2="292.5" y2="276.9" stroke="#F8FAFC" stroke-opacity="0.88" stroke-width="13" stroke-linecap="round"/><line x1="585" y1="113.1" x2="585" y2="179.4" stroke="#F8FAFC" stroke-opacity="0.88" stroke-width="13" stroke-linecap="round"/></g>
        <g id="solve-nums"><text data-num="1" data-idx="0" x="536.25" y="341.25" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="800" font-size="39" fill="#FB7185" stroke="#0F172A" stroke-width="0" stroke-linejoin="round" paint-order="stroke">1</text><text data-num="2" data-idx="9" x="731.25" y="633.75" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="800" font-size="39" fill="#FB7185" stroke="#0F172A" stroke-width="0" stroke-linejoin="round" paint-order="stroke">2</text><text data-num="3" data-idx="18" x="146.25" y="536.25" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="800" font-size="39" fill="#FB7185" stroke="#0F172A" stroke-width="0" stroke-linejoin="round" paint-order="stroke">3</text><text data-num="4" data-idx="26" x="48.75" y="633.75" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="800" font-size="39" fill="#FB7185" stroke="#0F172A" stroke-width="0" stroke-linejoin="round" paint-order="stroke">4</text><text data-num="5" data-idx="36" x="243.75" y="243.75" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="800" font-size="39" fill="#FB7185" stroke="#0F172A" stroke-width="0" stroke-linejoin="round" paint-order="stroke">5</text><text data-num="6" data-idx="46" x="438.75" y="243.75" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="800" font-size="39" fill="#FB7185" stroke="#0F172A" stroke-width="0" stroke-linejoin="round" paint-order="stroke">6</text><text data-num="7" data-idx="53" x="731.25" y="48.75" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="800" font-size="39" fill="#FB7185" stroke="#0F172A" stroke-width="0" stroke-linejoin="round" paint-order="stroke">7</text><text data-num="8" data-idx="63" x="633.75" y="536.25" text-anchor="middle" dominant-baseline="central" font-family="Lexend" font-weight="800" font-size="39" fill="#FB7185" stroke="#0F172A" stroke-width="0" stroke-linejoin="round" paint-order="stroke">8</text></g>
      </svg></div>
      <div id="solve-flash"></div>
      <div id="solve-ring"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const PATH = [[3,5],[3,4],[3,3],[4,3],[4,4],[4,5],[5,5],[6,5],[6,6],[6,7],[7,7],[7,6],[7,5],[7,4],[6,4],[5,4],[5,3],[5,2],[5,1],[6,1],[6,2],[6,3],[7,3],[7,2],[7,1],[7,0],[6,0],[5,0],[4,0],[4,1],[4,2],[3,2],[3,1],[3,0],[2,0],[2,1],[2,2],[1,2],[1,1],[1,0],[0,0],[0,1],[0,2],[0,3],[1,3],[2,3],[2,4],[2,5],[1,5],[1,4],[0,4],[0,5],[0,6],[0,7],[1,7],[1,6],[2,6],[2,7],[3,7],[3,6],[4,6],[4,7],[5,7],[5,6]];
    const CELL = 97.5;
    const STEPS = 63;
    const SOLVE_SECONDS = 47;
    const DRAW_START = 0.3, DRAW_DUR = 8.79, HIT = 9.09;
    const HOOK_DY = 76, HOOK_SCALE = 0.6;
    const segs = Array.from(document.querySelectorAll("#solve-ribbon [data-seg]"));
    const nums = Array.from(document.querySelectorAll("#solve-nums [data-num]"));
    const tipGlow = document.getElementById("solve-tipglow");
    const tipDot = document.getElementById("solve-tipdot");
    const tip = document.getElementById("solve-tip");
    const clock = document.getElementById("solve-clock");
    const dM = document.getElementById("solve-m");
    const d1 = document.getElementById("solve-s1");
    const d2 = document.getElementById("solve-s2");
    const flash = document.getElementById("solve-flash");
    const ring = document.getElementById("solve-ring");
    const board = document.getElementById("solve-board");
    const kicker = document.getElementById("solve-kicker");
    const solved = document.getElementById("solve-solved");
    const STOPS = [[255,107,44],[255,197,61],[255,77,109],[232,121,249]];
    const TEAL = [45,212,191], WHITE = [248,250,252];
    function colorAt(i) {
      if (i <= 0) i = 0;
      const w = (i / 4) % STOPS.length, k = Math.floor(w) % STOPS.length, f = w - Math.floor(w);
      const a = STOPS[k], b = STOPS[(k + 1) % STOPS.length];
      return "rgb(" + a.map((v, j) => Math.round(v + (b[j] - v) * f)).join(",") + ")";
    }
    const clamp = (v) => Math.max(0, Math.min(1, v));
    const easeP = (x) => { const u = clamp(x); return 0.5 * u + 0.5 * u * u * (3 - 2 * u); };
    const inOut3 = (x) => { const u = clamp(x); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
    const out4 = (x) => 1 - Math.pow(1 - clamp(x), 4);
    const centre = (i) => [(PATH[i][1] + 0.5) * CELL, (PATH[i][0] + 0.5) * CELL];
    // Everything below is a pure function of scene time t.
    function render(t) {
      const p = STEPS * easeP((t - DRAW_START) / DRAW_DUR);
      for (let i = 0; i < segs.length; i++) {
        const f = clamp(p - i);
        segs[i].setAttribute("opacity", f > 0 ? "1" : "0");
        segs[i].setAttribute("stroke-dashoffset", String(CELL * (1 - f)));
      }
      const i = Math.min(Math.floor(p), STEPS);
      const f = p - i;
      const a = centre(i), b = centre(Math.min(i + 1, STEPS));
      const x = a[0] + (b[0] - a[0]) * f, y = a[1] + (b[1] - a[1]) * f;
      const col = colorAt(p);
      for (const el of [tipGlow, tipDot]) { el.setAttribute("cx", x); el.setAttribute("cy", y); el.setAttribute("fill", col); }
      // tip lands on "1" as the scene opens
      const tipIn = out4(t / 0.25);
      tip.setAttribute("opacity", String(tipIn));
      tip.setAttribute("transform", "translate(" + x + " " + y + ") scale(" + (0.4 + 0.6 * tipIn) + ") translate(" + -x + " " + -y + ")");
      for (const n of nums) {
        const on = p > 0.02 && p >= Number(n.dataset.idx) - 0.35;
        n.setAttribute("fill", on ? "#F8FAFC" : "#FB7185");
        n.setAttribute("stroke-width", on ? "8" : "0");
      }
      // The clock: seconds from solve progress, 0..47, exactly 47 when p = 63.
      const s = Math.floor((SOLVE_SECONDS * p) / STEPS + 1e-9);
      dM.textContent = "0";
      d1.textContent = String(Math.floor(s / 10));
      d2.textContent = String(s % 10);
      // Clock rises from the hook position to hero size (0.45 -> 0.95 s).
      const m = inOut3((t - 0.45) / 0.5);
      const h = t - HIT; // time since the solve
      let pop = 1;
      if (h >= 0) pop = 1 + 0.16 * Math.exp(-7 * h) * Math.cos(15 * h);
      const sc = (HOOK_SCALE + (1 - HOOK_SCALE) * m) * pop;
      clock.style.transform = "translateY(" + (HOOK_DY * (1 - m)) + "px) scale(" + sc + ")";
      const tc = h >= 0 ? 1 : 0;
      clock.style.color = "rgb(" + WHITE.map((v, j) => Math.round(v + (TEAL[j] - v) * tc)).join(",") + ")";
      // Solve: teal flash over the board, ring holds, board bumps.
      flash.style.opacity = h >= 0 ? String(0.5 * Math.pow(1 - clamp(h / 0.6), 2)) : "0";
      ring.style.opacity = h >= 0 ? String(out4(h / 0.3)) : "0";
      const bump = h >= 0 ? 1 + 0.025 * Math.exp(-6 * h) * Math.cos(12 * h) : 1;
      board.style.transform = "scale(" + bump + ")";
      // Kicker: TODAY'S ZIP fades in under the rising clock, swaps to SOLVED on the hit.
      const kin = out4((t - 0.7) / 0.2);
      const swap = h >= 0 ? out4((h - 0.1) / 0.18) : 0;
      kicker.style.opacity = String(kin * (1 - swap));
      kicker.style.filter = "blur(" + (8 * (1 - kin) + 8 * swap) + "px)";
      solved.style.opacity = String(swap);
      solved.style.filter = "blur(" + 8 * (1 - swap) + "px)";
    }
    const state = { t: 0 };
    render(0);
    // Hook copy carried over from the hook scene, then blurs away as the clock rises.
    tl.fromTo("#solve-text .l1", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 0.45);
    tl.fromTo("#solve-text .l2", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 0.5);
    // One linear driver over the whole scene; render(t) is a pure function of it.
    tl.fromTo(state, { t: 0 }, { t: 10.6, duration: 10.6, ease: "none", onUpdate: () => render(state.t) }, 0);
    window.__timelines["solve"] = tl;
  </script>
</template>
